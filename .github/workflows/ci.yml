name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FREENET_CORE_VERSION: "v0.2.118"

jobs:
  build:
    name: Build (arm64 + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space on runner
        run: |
          docker system prune -af --volumes
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout freenet-android-node
        uses: actions/checkout@v4
        with:
          path: freenet-android-node

      - name: Checkout freenet-core (sibling)
        uses: actions/checkout@v4
        with:
          repository: freenet/freenet-core
          ref: ${{ env.FREENET_CORE_VERSION }}
          path: freenet-core

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        working-directory: freenet-android-node
        run: docker compose build dev

      - name: Build native libraries (arm64)
        working-directory: freenet-android-node
        run: |
          docker compose run --rm dev bash -c 'cd /workspace/freenet-android-node && ./scripts/build.sh arm64-v8a'
        timeout-minutes: 30

      - name: Build native libraries (x86_64)
        working-directory: freenet-android-node
        run: |
          docker compose run --rm dev bash -c 'cd /workspace/freenet-android-node && ./scripts/build.sh x86_64'
        timeout-minutes: 30

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freenet-android-build
          path: |
            freenet-android-node/android/app/build/outputs/
            freenet-android-node/android/app/src/main/jniLibs/
          retention-days: 14
          if-no-files-found: warn
