name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FREENET_CORE_VERSION: "v0.2.118"

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space on runner
        run: |
          docker system prune -af --volumes
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout freenet-android-node
        uses: actions/checkout@v4
        with:
          path: freenet-android-node

      - name: Checkout freenet-core (sibling)
        uses: actions/checkout@v4
        with:
          repository: freenet/freenet-core
          ref: ${{ env.FREENET_CORE_VERSION }}
          path: freenet-core

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fix volume mount permissions (host-side)
        working-directory: freenet-android-node
        run: |
          echo "Current directory ownership:"
          ls -la .
          echo "Setting owner to uid:gid 1000:1000 (matches container developer user)..."
          sudo chown -R 1000:1000 .
          echo "After chown:"
          ls -la .
      - name: Build dev image
        working-directory: freenet-android-node
        run: docker compose build dev

      - name: Run full check suite (as root to fix volume permissions)
        working-directory: freenet-android-node
        run: docker compose run --rm --user 0 dev bash -c "chmod -R u+rwX /workspace/freenet-android-node && scripts/check.sh"

      - name: Upload APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: freenet-android-debug
          path: |
            freenet-android-node/android/app/build/outputs/apk/debug/app-debug.apk
            freenet-android-node/android/app/src/main/jniLibs/
          retention-days: 14
