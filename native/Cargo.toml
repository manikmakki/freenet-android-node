[package]
name = "freenet-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "freenet_android"
crate-type = ["cdylib"]

[features]
default = [
    "freenet-redb",
    "freenet-trace",
    "freenet-wasmtime",
    "freenet-websocket",
]
freenet-redb = ["freenet/redb"]
freenet-trace = ["freenet/trace"]
freenet-wasmtime = ["freenet/wasmtime-backend"]
freenet-websocket = ["freenet/websocket"]

[dependencies]
freenet = { path = "../../freenet-core/crates/core", default-features = false }
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
